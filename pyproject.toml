[project]
name = "probabilistic-decision-models"
version = "0.1.0"
description = "Lectures, notebooks, and experiments on probabilistic decision models."
readme = "README.md"
license = "MIT"
authors = [{ name = "khue" }]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "matplotlib",
]

[project.optional-dependencies]
notebooks = ["jupyterlab"]
providers = ["httpx", "python-dotenv", "typesafe-sdk"]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdm"]
